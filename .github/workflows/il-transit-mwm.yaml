name: Israel transit (GTFS) MWM

# Weekly pipeline: download the Israeli Ministry of Transport GTFS feed,
# convert it to Organic Maps transit JSON, and (stage 2) bake it into an
# Israel.mwm that the app can side-load. Artifacts are published to a fixed
# GitHub Release tag so the download URL is permanent.
#
# Permanent download URL (once the release exists):
#   https://github.com/${{ github.repository }}/releases/download/il-transit-latest/Israel.mwm
#
# NOTE on routing model: this uses Organic Maps' CURRENT transit pipeline,
# which is frequency/headway-based (not exact-departure). Exact-timetable
# ("catch the 08:14") routing requires the C++ changes tracked separately
# (converter + on-device schedule format + time-dependent router). This
# workflow is "Phase 0": it proves build -> mwm -> side-load end to end and
# delivers the weekly automation + permanent link.

on:
  workflow_dispatch: {}        # manual trigger
  schedule:
    - cron: '0 2 * * 0'        # every Sunday 02:00 UTC

concurrency:
  group: il-transit-mwm
  cancel-in-progress: false

permissions:
  contents: write              # needed to publish release assets

env:
  GTFS_URL: https://gtfs.mot.gov.il/gtfsfiles/israel-public-transportation.zip
  RELEASE_TAG: il-transit-latest

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — build the converter, fetch GTFS, produce OM transit JSON.
  # High confidence: this is the GTFS-specific heart of the pipeline.
  # ---------------------------------------------------------------------------
  convert:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Restore Boost submodule from cache
        uses: actions/cache@v5
        with:
          path: |
            3party/boost
            .git/modules/3party/boost
          key: boost-submodule

      - name: Parallel submodules checkout
        run: git submodule update --depth 1 --init --recursive --jobs=20

      - name: Install build dependencies
        # Mirror the proven build-cmake.yaml recipe. We only build one target
        # below, but configure needs the full Qt6 set (the version check at
        # CMakeLists.txt:158 reads Qt6Widgets_VERSION).
        run: |
          sudo apt update -y
          sudo apt install -y \
            clang-19 libgl1-mesa-dev libglvnd-dev libharfbuzz-dev \
            libqt6svg6-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev ninja-build qt6-base-dev qt6-positioning-dev \
            curl unzip

      - name: Configure repository
        run: ./configure.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: il-transit-gtfs_converter

      - name: Configure cmake
        env:
          CC: clang-19
          CXX: clang++-19
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_UNITY_BUILD=ON

      - name: Build gtfs_converter
        run: ninja -C build gtfs_converter

      - name: Download Israeli GTFS feed
        # The MoT endpoint serves the zip only on GET (HEAD returns an error page).
        run: |
          mkdir -p feeds/israel
          curl -fSL --retry 3 -o feeds/israel/gtfs.zip "$GTFS_URL"
          unzip -o feeds/israel/gtfs.zip -d feeds/israel
          rm feeds/israel/gtfs.zip
          ls -lh feeds/israel

      - name: Restore ID-mapping files from release (consistency across runs)
        # CRITICAL: gtfs_converter assigns stable transit-entity IDs only if the
        # mapping files are reused. Without this, routing across map versions breaks.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" \
            --pattern 'mapping*.txt' --dir . 2>/dev/null || \
            echo "No previous mapping files (first run) — they will be created."
          touch mapping.txt mapping_edges.txt

      - name: Convert GTFS -> Organic Maps transit JSON
        run: |
          mkdir -p transit_json
          ./build/gtfs_converter \
            --path_gtfs_feeds=feeds \
            --path_mapping=mapping.txt \
            --path_mapping_edges=mapping_edges.txt \
            --path_json=transit_json \
            --path_resources=data
          echo "Produced JSON:"; ls -lh transit_json

      - name: Upload transit JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: israel-transit-json
          path: transit_json
          retention-days: 14

      - name: Publish JSON + mapping files to permanent release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail loudly if the converter produced nothing (e.g. feed rejected).
          if [ -z "$(ls -A transit_json 2>/dev/null)" ]; then
            echo "::error::transit_json is empty — gtfs_converter produced no output"
            exit 1
          fi
          tar czf israel-transit-json.tar.gz -C transit_json .
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "Israel transit (latest)" \
              --notes "Auto-updated weekly from MoT GTFS. See il-transit-mwm.yaml."
          # Upload JSON + only the mapping files that are non-empty (empty -> HTTP 400).
          assets="israel-transit-json.tar.gz"
          for m in mapping.txt mapping_edges.txt; do
            [ -s "$m" ] && assets="$assets $m"
          done
          gh release upload "$RELEASE_TAG" $assets --clobber

  # ---------------------------------------------------------------------------
  # Stage 2 — bake the transit JSON into Israel.mwm via maps_generator.
  # NOTE: maps_generator single-country setup needs first-run iteration
  # (region config, borders, coastline handling). Kept separate so Stage 1
  # delivers value even while this is tuned.
  # ---------------------------------------------------------------------------
  build-map:
    needs: convert
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Restore Boost submodule from cache
        uses: actions/cache@v5
        with:
          path: |
            3party/boost
            .git/modules/3party/boost
          key: boost-submodule

      - name: Parallel submodules checkout
        run: git submodule update --depth 1 --init --recursive --jobs=20

      - name: Install build dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            clang-19 libgl1-mesa-dev libglvnd-dev libharfbuzz-dev \
            libqt6svg6-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev ninja-build qt6-base-dev qt6-positioning-dev \
            curl unzip python3 python3-pip

      - name: Configure repository
        run: ./configure.sh

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: il-transit-generator_tool

      - name: Configure cmake
        env:
          CC: clang-19
          CXX: clang++-19
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          cmake . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_UNITY_BUILD=ON

      - name: Build generator tools
        # maps_generator needs all three (see tools/python/maps_generator/README setup).
        run: ninja -C build generator_tool mwm_diff_tool world_roads_builder_tool

      - name: Fetch transit JSON from Stage 1
        uses: actions/download-artifact@v4
        with:
          name: israel-transit-json
          path: transit_json

      - name: Install maps_generator python deps
        # requirements_dev.txt pulls tooling excluded from this fork (descriptions); install
        # the actual third-party runtime deps directly.
        run: pip3 install --break-system-packages filelock requests requests_file beautifulsoup4

      - name: Configure map_generator.ini
        # Point the generator at our local pbf, the built generator_tool, and the
        # transit JSON dir. USER_RESOURCE_PATH/MAIN_OUT_PATH resolve via OMIM_PATH.
        run: |
          cd tools/python/maps_generator
          cp var/etc/map_generator.ini.default var/etc/map_generator.ini
          python3 - "$GITHUB_WORKSPACE" <<'PY'
          import re, sys
          ws = sys.argv[1]
          p = "var/etc/map_generator.ini"
          s = open(p).read()
          def setkey(s, key, val):
              return re.sub(r"^[#\s]*" + re.escape(key) + r"\s*:.*$",
                            f"{key}: {val}", s, count=1, flags=re.M)
          s = setkey(s, "OMIM_PATH", ws)
          s = setkey(s, "BUILD_PATH", ws + "/build")
          geofabrik = "https://download.geofabrik.de/asia/israel-and-palestine-latest.osm.pbf"
          s = setkey(s, "PLANET_URL", geofabrik)
          s = setkey(s, "PLANET_MD5_URL", geofabrik + ".md5")
          # Trailing slash matters: file.py is_dir() treats it as a directory to list.
          s = setkey(s, "TRANSIT_URL", "file://" + ws + "/transit_json/")
          open(p, "w").write(s)
          print(s)
          PY

      - name: Generate Israel maps with transit
        run: |
          # generator_tool writes settings here on startup; pre-create it to avoid a
          # FileSystemException (and a race between parallel per-country processes).
          mkdir -p "$HOME/.config/OMaps"
          cd tools/python
          python3 -m maps_generator \
            --countries="Israel,Jerusalem,Palestine" \
            --skip="Coastline,Descriptions"

      - name: Dump generator logs (always)
        if: always()
        run: |
          echo "===== RoutingTransit logs (why Israel transit is empty) ====="
          find "$GITHUB_WORKSPACE/.." -path "*maps_build*logs*" -iname "*RoutingTransit*" 2>/dev/null \
            -exec sh -c 'echo "---- $1 ----"; cat "$1"' _ {} \;
          echo "===== all stage logs (tail) ====="
          find "$GITHUB_WORKSPACE/.." -path "*maps_build*logs*" -name "*.log" 2>/dev/null \
            -exec sh -c 'echo "---- $1 ----"; tail -40 "$1"' _ {} \;

      - name: Collect and publish mwm files
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mwms=$(find "$GITHUB_WORKSPACE/.." -path "*maps_build*" -name "*.mwm" 2>/dev/null \
                 | grep -iE "Israel|Jerusalem|Palestine" || true)
          echo "Found mwm files:"; echo "$mwms"
          [ -z "$mwms" ] && { echo "::error::no mwm produced"; exit 1; }
          echo "=== transit section check (tag count per mwm) ==="
          for m in $mwms; do
            echo "$(basename "$m"): transit-tag occurrences = $(grep -aoc transit "$m" || echo 0)"
          done
          gh release upload "$RELEASE_TAG" $mwms --clobber
